project:
  type: website
lang: it
website:
  title: "Ragioniamoci!"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Lezioni
        menu:
           - href: presentazioni/RipassoI.qmd      
             target: _blank
           - href: presentazioni/Equazioni.qmd   
             target: _blank        
           - href: presentazioni/IngressoTerza.qmd
             target: _blank      
           - href: presentazioni/DisequazioneFratta.qmd  
             target: _blank
           - href: presentazioni/SezioneAurea.qmd
             target: _blank
      - text: Schemi
        href: schemi/Equa.qmd  
      - text: Simulazioni 
        href: simulazioni/laboratorio_dei_colori.html
  sidebar:
    - id: schemi-sidebar
      title: Schemi
      href: schemi/
      contents: schemi/*
      style: "docked"
      search: true           
format:
  html:
    link-external-newwindow: true # Apre automaticamente i link esterni/slide in nuove schede
    layout: max-width
    theme:
      - cosmo
    css: styles.css
    toc: true
    html-math-method: katex
    other-links:
      - text: Stampa / Salva in PDF
        icon: printer
        href: "#print"
        id: print-button
    include-in-header:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", function() {
          document.querySelectorAll('a[href="#print"]').forEach(function(el) {
              el.addEventListener('click', function(e) {
              e.preventDefault();
              window.print();
            });
          });
        });
        </script>

execute:
  echo: false    # Nasconde il codice in tutto il sito
  warning: false # Nasconde eventuali messaggi di errore tecnici

